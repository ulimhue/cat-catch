name: Build Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CRX3_VERSION: 2.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-crx3-${{ env.CRX3_VERSION }}
          restore-keys: |
            ${{ runner.os }}-npm-crx3-

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package Chrome
        run: |
          mkdir -p dist/chrome
          cp -r catch-script css img js lib _locales *.html manifest.json dist/chrome/
          (cd dist/chrome && zip -qr "../cat-catch-chrome-${{ steps.ver.outputs.version }}.zip" .)

      - name: Package Firefox
        run: |
          mkdir -p dist/firefox
          cp -r catch-script css img js lib _locales *.html dist/firefox/
          cp manifest.firefox.json dist/firefox/manifest.json
          (cd dist/firefox && zip -qr "../cat-catch-firefox-${{ steps.ver.outputs.version }}.zip" .)

      - name: Build CRX
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "CRX_PRIVATE_KEY 未配置，跳过 crx 签名"
            exit 0
          fi
          printf '%s' "$CRX_PRIVATE_KEY" > private-key.pem
          npm install -g "crx3@${CRX3_VERSION}"
          crx3 -p private-key.pem -o "dist/cat-catch-${{ steps.ver.outputs.version }}.crx" dist/chrome/

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/cat-catch-chrome-${{ steps.ver.outputs.version }}.zip
          archive: false

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/cat-catch-firefox-${{ steps.ver.outputs.version }}.zip
          archive: false

      - name: Upload CRX artifact
        if: hashFiles('dist/*.crx') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/cat-catch-${{ steps.ver.outputs.version }}.crx
          archive: false

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/*.crx
          fail_on_unmatched_files: false
